[pytest]
# Pytest configuration for sales_report_v2_independent

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --import-mode=importlib

# Log capture — emits app-level logs inline with test output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_cli_date_format = %H:%M:%S
junit_family = xunit2

# Test paths
testpaths = tests azure_functions/tests

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests with mocked dependencies
    slow: Tests that take longer to execute
    deployment: Post-deployment smoke tests — validate system is operational after a deploy
    smoke: Lightweight pre-deploy startup and import checks
    
# Minimum Python version
minversion = 3.11

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term
