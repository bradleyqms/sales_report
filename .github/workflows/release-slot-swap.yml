name: Promote Staging Slots to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v2.3.1)"
        required: false
        default: ""
      perform_swap:
        description: "Set true to perform production swap"
        required: true
        type: boolean
        default: false

env:
  WEBAPP_NAME: qms-sales-report
  WEBAPP_RESOURCE_GROUP: DefaultResourceGroup-DEWC
  FUNCTIONAPP_NAME: qms-dispatch-reports
  FUNCTIONAPP_RESOURCE_GROUP: qms-dispatch-reports_group
  STAGING_SLOT: staging
  PRODUCTION_SLOT: production

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B0872E0EEB6746F79DB177474AED0FAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_10E542CBFEFF44669055B2D2CAAE3283 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_44CA99ED92904E0B9D906C58AA8739C8 }}

      - name: Verify staging slots are running
        shell: bash
        run: |
          set -euo pipefail
          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCE_GROUP" \
            --slot "$STAGING_SLOT" \
            --query "{name:name,state:state,host:defaultHostName}" \
            -o table

          az functionapp show \
            --name "$FUNCTIONAPP_NAME" \
            --resource-group "$FUNCTIONAPP_RESOURCE_GROUP" \
            --slot "$STAGING_SLOT" \
            --query "{name:name,state:state,host:defaultHostName}" \
            -o table

      - name: Probe staging /healthz
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Web app staging /healthz"
          curl -fsS --max-time 15 \
            "https://${{ env.WEBAPP_NAME }}-staging.azurewebsites.net/healthz" \
            | python3 -m json.tool
          echo "::endgroup::"

      - name: Confirm last CI test run passed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list \
            --branch main \
            --workflow azure-webapps-python.yml \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "Last webapp CI run conclusion: $conclusion"
          [ "$conclusion" = "success" ] || \
            (echo "::error::Last CI run did not succeed (got: $conclusion)"; exit 1)

      - name: Show promotion intent
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Requested tag input: ${{ github.event.inputs.release_tag }}"
          echo "perform_swap: ${{ github.event.inputs.perform_swap }}"

  swap-to-production:
    runs-on: ubuntu-latest
    needs: preflight
    environment: production
    permissions:
      id-token: write
      contents: read
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.perform_swap == 'true')
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B0872E0EEB6746F79DB177474AED0FAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_10E542CBFEFF44669055B2D2CAAE3283 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_44CA99ED92904E0B9D906C58AA8739C8 }}

      - name: Swap web app staging to production
        shell: bash
        run: |
          set -euo pipefail
          az webapp deployment slot swap \
            --name "$WEBAPP_NAME" \
            --resource-group "$WEBAPP_RESOURCE_GROUP" \
            --slot "$STAGING_SLOT" \
            --target-slot "$PRODUCTION_SLOT"

      - name: Swap function app staging to production
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment slot swap \
            --name "$FUNCTIONAPP_NAME" \
            --resource-group "$FUNCTIONAPP_RESOURCE_GROUP" \
            --slot "$STAGING_SLOT" \
            --target-slot "$PRODUCTION_SLOT"

      - name: Postflight - production /healthz probe
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting 30s for production slot to warm up..."
          sleep 30
          echo "::group::Web app production /healthz"
          curl -fsS --max-time 15 \
            "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/healthz" \
            | python3 -m json.tool
          echo "::endgroup::"
