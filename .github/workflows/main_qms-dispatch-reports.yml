# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - qms-dispatch-reports

on:
  push:
    branches:
      - main
    paths:
      - 'azure_functions/**'
      - 'src/**'
      - 'data/inputs/**'
      - '.github/workflows/main_qms-dispatch-reports.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment package
        shell: bash
        run: |
          mkdir -p deploy_package/.python_packages/lib/site-packages

          # Azure Functions host files (host.json must be at package root)
          cp azure_functions/host.json         deploy_package/
          cp azure_functions/requirements.txt  deploy_package/

          # Timer-triggered functions
          cp -r azure_functions/dispatch_reports/         deploy_package/dispatch_reports/
          cp -r azure_functions/core_market_reports/      deploy_package/core_market_reports/
          cp -r azure_functions/dispatch_usa_spa_reports/  deploy_package/dispatch_usa_spa_reports/
          cp -r azure_functions/mapping_inputs_sync/       deploy_package/mapping_inputs_sync/
          cp -r azure_functions/refresh_unified_v2_timer/  deploy_package/refresh_unified_v2_timer/

          # src/ — full_report.py and all its imports
          cp -r src/ deploy_package/src/

          # Empty .env so load_dotenv() doesn't crash; real values come from App Settings
          touch deploy_package/.env

          # Pre-install dependencies into .python_packages so they're available
          # when running under WEBSITE_RUN_FROM_PACKAGE (Oryx does not run in this mode)
          pip install \
            --target deploy_package/.python_packages/lib/site-packages \
            --requirement azure_functions/requirements.txt \
            --no-cache-dir \
            --quiet

          echo "=== Package structure ==="
          find deploy_package -maxdepth 3 -type f | grep -v __pycache__ | head -80
          echo "Total size: $(du -sh deploy_package | cut -f1)"

      - name: Zip artifact for deployment
        run: |
          cd deploy_package
          zip -r ../release.zip . -x "**/__pycache__/*" -x "**/*.pyc"
          cd ..
          echo "Package size: $(du -sh release.zip | cut -f1)"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B0872E0EEB6746F79DB177474AED0FAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_10E542CBFEFF44669055B2D2CAAE3283 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_44CA99ED92904E0B9D906C58AA8739C8 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'qms-dispatch-reports'
          slot-name: 'staging'
          package: './release.zip'
          