name: Deploy — Dispatch Reports Function App

# ──────────────────────────────────────────────────────────────────────────────
# Deploys: qms-dispatch-reports  (Consumption plan, Python 3.11, Linux)
# Triggers: push to main that touches azure_functions/ or src/, or manual run
#
# What the package contains:
#   dispatch_reports/   ← the timer-triggered function + submodules
#   host.json
#   requirements.txt   ← Oryx installs these on the Azure side at deploy time
#   src/                ← full_report.py + SharePoint/report modules
#   .env                ← empty placeholder (real values come from App Settings)
#
# Auth: Publish Profile stored in GitHub secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE
#   Download from: Portal → Function App → Overview → Get publish profile
#
# Package strategy: scm-do-build-during-deployment=true so Oryx runs pip install
# on the correct Linux/Python runtime — avoids "no module 'pandas'" cold-start errors.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'azure_functions/**'
      - 'src/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: qms-dispatch-reports
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment package
        shell: bash
        run: |
          mkdir -p deploy_package

          # Azure Functions host files (host.json must be at root)
          cp azure_functions/host.json        deploy_package/
          cp azure_functions/requirements.txt deploy_package/

          # Timer-triggered functions and shared submodules
          cp -r azure_functions/dispatch_reports/   deploy_package/dispatch_reports/
          cp -r azure_functions/core_market_reports/ deploy_package/core_market_reports/

          # src/ — full_report.py and all its imports (sharepoint_client, etc.)
          cp -r src/ deploy_package/src/

          # Empty .env so load_dotenv() doesn't crash; real values come from App Settings
          touch deploy_package/.env

          echo "=== Package structure ==="
          find deploy_package -maxdepth 3 -type f | grep -v __pycache__ | head -60

          # Zip the package — code only, no pre-installed dependencies.
          # SCM_DO_BUILD_DURING_DEPLOYMENT=true is permanently set in the App Settings,
          # so Oryx runs pip install on the Azure side after this zip lands.
          cd deploy_package && zip -r ../package.zip . -x "**/__pycache__/*" -x "**/*.pyc"
          cd .. && echo "Package size: $(du -sh package.zip | cut -f1)"

      - name: Deploy via Kudu zip deploy
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          # Extract Kudu credentials from publish profile XML
          KUDU_URL=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=publishUrl=")[^"]+' | grep -i scm | head -1)
          KUDU_USER=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userName=")[^"]+' | head -1)
          KUDU_PASS=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userPWD=")[^"]+' | head -1)

          echo "Deploying to: https://$KUDU_URL"

          # Warm up the Kudu SCM site — Consumption plan sleeps and returns 503
          # on the first request. Retry up to 5 times with back-off.
          for attempt in 1 2 3 4 5; do
            echo "--- Attempt $attempt ---"
            HTTP=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
              -X POST "https://${KUDU_URL}/api/zipdeploy?isAsync=false" \
              -u "${KUDU_USER}:${KUDU_PASS}" \
              --data-binary @package.zip \
              -H "Content-Type: application/zip" \
              --max-time 600)

            echo "Kudu response HTTP $HTTP:"
            cat /tmp/deploy_response.txt || true

            if [[ "$HTTP" == "200" || "$HTTP" == "202" ]]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi

            if [[ "$attempt" -lt 5 ]]; then
              WAIT=$(( attempt * 30 ))
              echo "HTTP $HTTP — waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done

          echo "ERROR: Deploy failed after 5 attempts (last HTTP $HTTP)"
          exit 1
