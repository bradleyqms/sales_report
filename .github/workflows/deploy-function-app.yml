name: Deploy — Dispatch Reports Function App

# ──────────────────────────────────────────────────────────────────────────────
# Deploys: qms-dispatch-reports  (Consumption plan, Python 3.11, Linux)
# Triggers: push to main that touches azure_functions/ or src/, or manual run
#
# What the package contains:
#   dispatch_reports/   ← the timer-triggered function + submodules
#   host.json
#   requirements.txt   ← Oryx installs these on the Azure side at deploy time
#   src/                ← full_report.py + SharePoint/report modules
#   .env                ← empty placeholder (real values come from App Settings)
#
# Auth: Publish Profile stored in GitHub secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE
#   Download from: Portal → Function App → Overview → Get publish profile
#
# Package strategy: scm-do-build-during-deployment=true so Oryx runs pip install
# on the correct Linux/Python runtime — avoids "no module 'pandas'" cold-start errors.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'azure_functions/**'
      - 'src/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: qms-dispatch-reports
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    if: false  # Deployment handled by Azure Deployment Center — do not remove this file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment package
        shell: bash
        run: |
          mkdir -p deploy_package

          # Azure Functions host files (host.json must be at root)
          cp azure_functions/host.json        deploy_package/
          cp azure_functions/requirements.txt deploy_package/

          # Timer-triggered functions and shared submodules
          cp -r azure_functions/dispatch_reports/   deploy_package/dispatch_reports/
          cp -r azure_functions/core_market_reports/ deploy_package/core_market_reports/

          # src/ — full_report.py and all its imports (sharepoint_client, etc.)
          cp -r src/ deploy_package/src/

          # Empty .env so load_dotenv() doesn't crash; real values come from App Settings
          touch deploy_package/.env

          echo "=== Package structure ==="
          find deploy_package -maxdepth 3 -type f | grep -v __pycache__ | head -60

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy_package
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
